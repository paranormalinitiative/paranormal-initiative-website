# TPI local-only Wrangler configuration.
# This file intentionally contains no account ID, remote database ID, remote
# bucket, route, cron, or secret. Use scripts/local-dev.mjs to select it.
name = "tpi-local"
main = "worker.js"
# The installed local workerd currently supports through 2026-07-15. This is
# local-only; hosted production/development compatibility dates are unchanged.
compatibility_date = "2026-07-15"
compatibility_flags = [ "nodejs_compat" ]

[vars]
TPI_ENV = "local"
TPI_LOCAL_ONLY = "1"
TPI_LOCAL_ORIGIN = "http://127.0.0.1:8787"
TPI_DISABLE_OUTBOUND = "1"
FOUNDING50_DEVELOPMENT_ACTIVATION = "disabled"

[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"

[assets]
directory = ".local-dev/assets"
binding = "ASSETS"
run_worker_first = true
# Preserve exact local HTML fixture paths for isolated browser verification.
html_handling = "none"

[[d1_databases]]
binding = "TPI_DB"
database_name = "tpi-local-foundation"
database_id = "00000000-0000-4000-8000-000000000007"
preview_database_id = "tpi-local-foundation"

[[r2_buckets]]
binding = "TPI_MEDIA"
bucket_name = "tpi-local-media"
