<body data-ptd-page="find">

<main class="ptd-main">
    <section class="ptd-hero">
        <p class="ptd-kicker">TPI Paranormal Teams Directory</p>
        <h1>Find a Paranormal Team in your area:</h1>
        <p class="ptd-lede">Every listing was submitted by the team and reviewed by TPI leadership before appearing here.</p>
    </section>

    <h2 class="ptd-h2" id="us">
        <svg class="ptd-h2-icon ptd-h2-icon-us" viewBox="0 0 1000 620" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M32 60 L150 48 L300 50 L470 54 L500 60 L505 92 L512 78 L561 127 L603 82 L620 95 L691 121 L710 143 L722 174 L733 203 L768 205 L801 199 L825 183 L850 166 L871 152 L930 152 L939 60 L980 155 L934 185 L917 211 L863 247 L848 281 L838 314 L828 328 L846 372 L834 380 L747 425 L735 473 L747 497 L756 514 L761 569 L747 588 L722 523 L700 477 L644 466 L631 462 L615 500 L600 490 L526 494 L493 527 L493 566 L457 533 L434 493 L390 510 L342 440 L280 431 L240 428 L186 425 L144 421 L122 385 L87 374 L55 311 L22 256 L27 191 L20 71 L38 82 L44 66 Z"/></svg>
        United States
    </h2>
    <div class="ptd-region-grid" id="ptd-states-grid">
        <p class="ptd-status">Loading states...</p>
    </div>

    <h2 class="ptd-h2" id="international">
        <svg class="ptd-h2-icon ptd-h2-icon-intl" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="76" vector-effect="non-scaling-stroke"/>
            <ellipse cx="100" cy="100" rx="30" ry="76" vector-effect="non-scaling-stroke"/>
            <line x1="24" y1="100" x2="176" y2="100" vector-effect="non-scaling-stroke"/>
        </svg>
        International
    </h2>
    <div class="ptd-region-grid" id="ptd-countries-grid">
        <p class="ptd-status">Loading countries...</p>
    </div>
</main>

<script src="teams.js"></script>
<script>
(async function () {
    const stateGrid = document.getElementById("ptd-states-grid");
    const countryGrid = document.getElementById("ptd-countries-grid");

    function regionLink(label, count, href) {
        return `<a class="ptd-region-link" href="${href}">
            <strong>${PTD.escapeHtml(label)}</strong>
            <span>${count ? `${count} team${count === 1 ? "" : "s"}` : "No teams listed yet"}</span>
        </a>`;
    }

    try {
        const data = await PTD.api("/teams/counts");
        const states = data.states || {};
        const countries = data.countries || {};

        const stateNames = [...PTD.US_STATES];
        Object.keys(states).forEach(name => {
            if (!stateNames.some(candidate => candidate.toLowerCase() === name.toLowerCase())) stateNames.push(name);
        });
        stateNames.sort((a, b) => a.localeCompare(b));

        const countryNames = [...PTD.COUNTRIES];
        Object.keys(countries).forEach(name => {
            if (!countryNames.some(candidate => candidate.toLowerCase() === name.toLowerCase())) countryNames.push(name);
        });
        countryNames.sort((a, b) => a.localeCompare(b));

        stateGrid.innerHTML = stateNames
            .map(name => regionLink(name, states[name] || 0, `browse.html?state=${encodeURIComponent(name)}`))
            .join("");
        countryGrid.innerHTML = countryNames
            .map(name => regionLink(name, countries[name] || 0, `browse.html?country=${encodeURIComponent(name)}`))
            .join("");
    } catch (error) {
        stateGrid.innerHTML = `<p class="ptd-status is-error">Could not load the directory right now. Please try again.</p>`;
        countryGrid.innerHTML = "";
    }
})();
</script>

</body>
</html>
