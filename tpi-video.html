<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TPI Video | The Paranormal Initiative</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watch TPI video programming from The Paranormal Initiative — Applied Paranormal Research and Studies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=15">
    <style>
        .video-player-area {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0a0c10;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .video-player-area iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-player-area .video-thumb-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 3rem;
            text-align: center;
            width: 100%;
            height: 100%;
        }
        .video-player-area .video-thumb-fallback-icon {
            width: 100px;
            height: 100px;
            font-size: 2.5rem;
        }
        .video-player-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-detail-header {
            margin-bottom: 1.5rem;
        }
        .video-detail-header h1 {
            font-size: 1.6rem;
            color: #e8ecf4;
            line-height: 1.3;
            margin-bottom: 0.75rem;
        }
        .video-detail-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .video-detail-meta span {
            font-size: 0.82rem;
            color: #5a6070;
            font-weight: 600;
        }
        .video-detail-meta .video-card-category {
            color: #59a9dc !important;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .video-detail-description {
            background: #12151c;
            border: 1px solid #1e2230;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .video-detail-description p {
            color: #8d93a3;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .video-detail-series {
            font-size: 0.85rem;
            color: #59a9dc;
            margin-bottom: 0.5rem;
        }
        .video-detail-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .video-comments-section {
            margin-bottom: 2rem;
        }
        .video-comments-section h2 {
            font-size: 1.2rem;
            color: #e8ecf4;
            margin-bottom: 1rem;
        }
        .video-comment-form {
            background: #12151c;
            border: 1px solid #1e2230;
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .video-comment-form textarea {
            width: 100%;
            background: #0a0c10;
            border: 1px solid #1e2230;
            color: #c8cdd8;
            font-size: 0.9rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            margin-bottom: 0.75rem;
        }
        .video-comment-form textarea:focus { outline: none; border-color: #59a9dc; }
        .video-comment-form textarea::placeholder { color: #5a6070; }
        .video-comment-login-prompt {
            background: #12151c;
            border: 1px solid #1e2230;
            border-radius: 10px;
            padding: 1.25rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .video-comment-login-prompt p {
            color: #8d93a3;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }
        .video-comment {
            background: #12151c;
            border: 1px solid #1e2230;
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .video-comment-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .video-comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a2540, #0d1520);
            border: 1px solid #2a3550;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #59a9dc;
            font-weight: 700;
            flex-shrink: 0;
        }
        .video-comment-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .video-comment-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e8ecf4;
        }
        .video-comment-date {
            font-size: 0.75rem;
            color: #5a6070;
        }
        .video-comment-body {
            font-size: 0.9rem;
            color: #8d93a3;
            line-height: 1.6;
        }
        .video-comment-status {
            font-size: 0.85rem;
            color: #5a6070;
            margin-top: 0.5rem;
        }
        .video-related-section {
            margin-bottom: 2rem;
        }
        .video-related-section h2 {
            font-size: 1.2rem;
            color: #e8ecf4;
            margin-bottom: 1rem;
        }
        .video-related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }
        .video-related-card {
            background: #12151c;
            border: 1px solid #1e2230;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .video-related-card:hover { border-color: #2a3550; }
        .video-related-media {
            position: relative;
            background: #0a0c10;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-related-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-related-media .video-thumb-fallback { padding: 1rem; gap: 0.4rem; }
        .video-related-media .video-thumb-fallback-icon { width: 36px; height: 36px; font-size: 1rem; }
        .video-related-copy {
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            flex: 1;
        }
        .video-related-copy h3 {
            font-size: 0.85rem;
            color: #e8ecf4;
            line-height: 1.4;
        }
        .video-related-copy span {
            font-size: 0.72rem;
            color: #5a6070;
        }
        .video-back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #59a9dc;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }
        .video-back-link:hover { text-decoration: underline; }
        .video-live-banner {
            background: #dc2626;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .video-live-banner::before {
            content: "";
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: live-pulse 1.5s ease-in-out infinite;
        }
        @keyframes live-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .video-not-found {
            text-align: center;
            padding: 4rem 2rem;
        }
        .video-not-found h2 {
            color: #c8cdd8;
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }
        .video-not-found p {
            color: #5a6070;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 800px) {
            .video-detail-header h1 { font-size: 1.3rem; }
            .video-related-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<div id="video-detail-content"></div>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="tpi-videos.js"></script>
<script>
(function () {
    var videos = window.TPI_VIDEOS || [];
    var container = document.getElementById("video-detail-content");
    var videoId = new URLSearchParams(window.location.search).get("id");

    function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
        });
    }

    function formatDate(dateStr) {
        if (!dateStr) return "";
        var d = new Date(dateStr + "T00:00:00");
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }

    function getCategoryIcon(category) {
        var cat = String(category || "").toLowerCase();
        if (cat.indexOf("live") !== -1) return "\u{1F4FA}";
        if (cat.indexOf("evp") !== -1 || cat.indexOf("itc") !== -1) return "\u{1F3A4}";
        if (cat.indexOf("visual") !== -1 || cat.indexOf("scry") !== -1) return "\u{1F3AC}";
        if (cat.indexOf("investigation") !== -1) return "\u{1F50D}";
        if (cat.indexOf("equipment") !== -1) return "\u{1F4E1}";
        if (cat.indexOf("education") !== -1) return "\u{1F4DA}";
        return "\u{1F3AC}";
    }

    function renderThumbFallback(category) {
        return '<div class="video-thumb-fallback">' +
            '<div class="video-thumb-fallback-icon">' + getCategoryIcon(category) + '</div>' +
            '<span class="video-thumb-fallback-label">' + escapeHtml(category || "TPI Video") + '</span>' +
            '</div>';
    }

    function getVideoUrl(video) {
        return 'tpi-video.html?id=' + encodeURIComponent(video.slug || video.id);
    }

    function findVideo(id) {
        if (!id) return null;
        return videos.find(function (v) { return v.slug === id || v.id === id; }) || null;
    }

    function getRelated(video) {
        return videos.filter(function (v) {
            if (v === video) return false;
            if (v.category === video.category) return true;
            if (video.tags && v.tags) {
                for (var i = 0; i < video.tags.length; i++) {
                    if (v.tags.indexOf(video.tags[i]) !== -1) return true;
                }
            }
            if (video.series && v.series === video.series) return true;
            return false;
        }).slice(0, 6);
    }

    function renderRelated(related) {
        if (!related.length) return "";
        var html = '<section class="video-related-section"><h2>Related Videos</h2><div class="video-related-grid">';
        related.forEach(function (v) {
            var hasThumb = v.thumbnail && v.thumbnail.trim();
            var mediaHtml = hasThumb
                ? '<img src="' + escapeHtml(v.thumbnail) + '" alt="' + escapeHtml(v.title) + ' thumbnail" loading="lazy">'
                : renderThumbFallback(v.category);
            html += '<article class="video-related-card" onclick="window.location.href=\'' + getVideoUrl(v) + '\'">' +
                '<div class="video-related-media">' + mediaHtml + '</div>' +
                '<div class="video-related-copy">' +
                '<h3>' + escapeHtml(v.title) + '</h3>' +
                '<span>' + escapeHtml(v.category || "") + (v.publishedAt ? ' &middot; ' + formatDate(v.publishedAt) : '') + '</span>' +
                '</div></article>';
        });
        html += '</div></section>';
        return html;
    }

    function renderCommentsSection(videoId) {
        return '<section class="video-comments-section">' +
            '<h2>Comments</h2>' +
            '<div id="video-comment-form-area"></div>' +
            '<div id="video-comments-list"></div>' +
            '</section>';
    }

    function renderNotFound() {
        container.innerHTML =
            '<section class="video-not-found">' +
            '<h2>Video Not Found</h2>' +
            '<p>The video you are looking for does not exist or has been removed.</p>' +
            '<a class="portal-button" href="tpi-videos.html">Back to TPI Videos</a>' +
            '</section>';
    }

    function renderVideo(video) {
        var hasEmbed = video.embedUrl && video.embedUrl.trim();
        var hasThumb = video.thumbnail && video.thumbnail.trim();

        // Player area
        var playerHtml;
        if (hasEmbed) {
            playerHtml = '<div class="video-player-area">' +
                '<iframe src="' + escapeHtml(video.embedUrl) + '" title="' + escapeHtml(video.title) + '" allowfullscreen></iframe>' +
                '</div>';
        } else if (hasThumb) {
            playerHtml = '<div class="video-player-area">' +
                '<img src="' + escapeHtml(video.thumbnail) + '" alt="' + escapeHtml(video.title) + '">' +
                '</div>';
        } else {
            playerHtml = '<div class="video-player-area">' + renderThumbFallback(video.category) + '</div>';
        }

        // Live banner
        var liveBanner = video.isLive
            ? '<div class="video-live-banner">This stream is live now</div>'
            : '';

        // Series info
        var seriesHtml = video.series
            ? '<div class="video-detail-series">' + escapeHtml(video.series) + (video.episode ? ' &middot; Episode ' + video.episode : '') + '</div>'
            : '';

        // Actions
        var watchLabel = hasEmbed ? "Watch on " + escapeHtml(video.platform || "External Site") : "Watch on " + escapeHtml(video.platform || "External Site");
        var actionsHtml = '<div class="video-detail-actions">' +
            (video.videoUrl ? '<a class="portal-button" href="' + escapeHtml(video.videoUrl) + '" target="_blank" rel="noopener noreferrer">' + watchLabel + '</a>' : '') +
            '<a class="portal-button portal-button-secondary" href="tpi-videos.html">Back to TPI Videos</a>' +
            '</div>';

        // Related
        var related = getRelated(video);

        // Title
        document.title = escapeHtml(video.title) + " | TPI Videos | The Paranormal Initiative";

        // Meta description
        var metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.content = video.description
            ? video.description.substring(0, 155) + "..."
            : "Watch " + video.title + " on TPI Videos from The Paranormal Initiative.";

        container.innerHTML =
            '<a class="video-back-link" href="tpi-videos.html">&larr; Back to TPI Videos</a>' +
            liveBanner +
            playerHtml +
            '<div class="video-detail-header">' +
            seriesHtml +
            '<h1>' + escapeHtml(video.title) + '</h1>' +
            '<div class="video-detail-meta">' +
            '<span class="video-card-category">' + escapeHtml(video.category || "Video") + '</span>' +
            (video.publishedAt ? '<span>' + formatDate(video.publishedAt) + '</span>' : "") +
            (video.duration ? '<span>' + escapeHtml(video.duration) + '</span>' : "") +
            (video.platform ? '<span>' + escapeHtml(video.platform) + '</span>' : "") +
            '</div>' +
            '</div>' +
            actionsHtml +
            (video.description ? '<div class="video-detail-description"><p>' + escapeHtml(video.description) + '</p></div>' : '') +
            renderCommentsSection(video.slug || video.id) +
            renderRelated(related);

        // Initialize comments
        initComments(video.slug || video.id);
    }

    // === COMMENTS SYSTEM ===
    var currentUser = null;

    async function initComments(videoId) {
        var formArea = document.getElementById("video-comment-form-area");
        var listArea = document.getElementById("video-comments-list");

        // Check auth status
        try {
            var res = await fetch("/api/auth/me", { credentials: "same-origin" });
            if (res.ok) {
                var data = await res.json();
                currentUser = data.user;
            }
        } catch (e) {}

        // Render comment form
        if (currentUser) {
            formArea.innerHTML =
                '<form class="video-comment-form" id="video-comment-form">' +
                '<textarea id="video-comment-input" placeholder="Share your thoughts..." maxlength="2000" required></textarea>' +
                '<button class="portal-button" type="submit">Post Comment</button>' +
                '<p class="video-comment-status" id="video-comment-status"></p>' +
                '</form>';
            document.getElementById("video-comment-form").addEventListener("submit", handleCommentSubmit);
        } else {
            formArea.innerHTML =
                '<div class="video-comment-login-prompt">' +
                '<p>Sign in or create a free member account to join the discussion.</p>' +
                '<a class="portal-button" href="member-login.html">Sign In</a>' +
                '</div>';
        }

        // Load comments
        await loadComments(videoId);
    }

    async function loadComments(videoId) {
        var listArea = document.getElementById("video-comments-list");
        try {
            var res = await fetch("/api/video-comments?videoId=" + encodeURIComponent(videoId), { credentials: "same-origin" });
            if (res.ok) {
                var data = await res.json();
                renderCommentsList(data.comments || []);
            } else {
                listArea.innerHTML = '<p class="video-comment-status">No comments yet. Be the first to join the discussion.</p>';
            }
        } catch (e) {
            listArea.innerHTML = '<p class="video-comment-status">No comments yet. Be the first to join the discussion.</p>';
        }
    }

    function renderCommentsList(comments) {
        var listArea = document.getElementById("video-comments-list");
        if (!comments.length) {
            listArea.innerHTML = '<p class="video-comment-status">No comments yet. Be the first to join the discussion.</p>';
            return;
        }
        var html = '';
        comments.forEach(function (c) {
            var initial = (c.displayName || c.username || "M").charAt(0).toUpperCase();
            html += '<article class="video-comment">' +
                '<div class="video-comment-header">' +
                '<div class="video-comment-avatar">' + escapeHtml(initial) + '</div>' +
                '<div class="video-comment-info">' +
                '<span class="video-comment-name">' + escapeHtml(c.displayName || c.username || "Member") + '</span>' +
                '<span class="video-comment-date">' + formatDate(c.createdAt) + '</span>' +
                '</div>' +
                '</div>' +
                '<div class="video-comment-body">' + escapeHtml(c.body) + '</div>' +
                '</article>';
        });
        listArea.innerHTML = html;
    }

    async function handleCommentSubmit(e) {
        e.preventDefault();
        var input = document.getElementById("video-comment-input");
        var status = document.getElementById("video-comment-status");
        var body = input.value.trim();
        if (!body) return;

        status.textContent = "Posting...";
        try {
            var res = await fetch("/api/video-comments", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ videoId: videoId, body: body })
            });
            var data = await res.json();
            if (res.ok) {
                input.value = "";
                status.textContent = "Comment posted.";
                await loadComments(videoId);
            } else {
                status.textContent = data.error || "Could not post comment.";
            }
        } catch (e) {
            status.textContent = "Could not post comment.";
        }
    }

    // === INIT ===
    if (!videoId) {
        renderNotFound();
    } else {
        var video = findVideo(videoId);
        if (!video) {
            renderNotFound();
        } else {
            renderVideo(video);
        }
    }
})();
</script>
</body>
</html>
