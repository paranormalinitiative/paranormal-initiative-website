<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Watch History | The Paranormal Initiative</title><link rel="stylesheet" href="style.css?v=89"><link rel="stylesheet" href="member-shell.css?v=62"></head>
<body><div id="site-header"></div><div data-member-content hidden><main class="member-main-inner"><section class="portal-hero"><p class="portal-kicker">Your Library</p><h1>Watch History</h1><p>Your viewing history is private to your account. You can clear individual entries or the complete list.</p><button id="clear-all-history" class="portal-button portal-button-secondary" type="button">Clear history</button></section><div id="watch-history-status" class="video-discovery-status" role="status"></div><div id="watch-history-list"></div></main></div><div id="site-footer"></div><script src="includes.js"></script><script src="member-shell.js?v=55"></script><script>
(function(){
  var list=document.getElementById("watch-history-list"), status=document.getElementById("watch-history-status");
  function esc(v){return String(v||"").replace(/[&<>\"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c]})}
  function load(){status.textContent="Loading history...";fetch("/api/video-history",{credentials:"same-origin"}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(d){var items=d.history||[];status.textContent="";if(!items.length){list.innerHTML='<div class="video-empty-state"><h3>No watch history yet.</h3><p>History is added after you begin watching a video.</p></div>';return}list.innerHTML='<div class="study-hub-layout">'+items.map(function(item){var href=item.sourceType==="discovered"?item.destinationUrl:"tpi-video.html?id="+encodeURIComponent(item.videoId);var attrs=item.sourceType==="discovered"?' target="_blank" rel="noopener noreferrer"':'';return '<article class="study-hub-card"><p class="portal-kicker">'+esc(item.platform||"TPI Video")+'</p><h3>'+esc(item.title)+'</h3><p>'+esc(item.completed?"Completed":"In progress")+'</p><a class="portal-button" href="'+esc(href)+'"'+attrs+'>Watch again</a> <button class="portal-button portal-button-secondary" type="button" data-remove="'+esc(item.videoId)+'">Remove</button></article>'}).join("")+'</div>';list.querySelectorAll("[data-remove]").forEach(function(btn){btn.addEventListener("click",function(){fetch("/api/video-history?videoId="+encodeURIComponent(btn.dataset.remove),{method:"DELETE",credentials:"same-origin"}).then(load)})})}).catch(function(){status.textContent="Unable to load watch history."})}
  document.getElementById("clear-all-history").addEventListener("click",function(){if(!confirm("Clear your TPI video watch history?"))return;fetch("/api/video-history",{method:"DELETE",credentials:"same-origin"}).then(load)});load();
})();</script></body></html>
