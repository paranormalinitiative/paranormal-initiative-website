<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TPI Creator Channel</title><link rel="stylesheet" href="style.css?v=89"><link rel="stylesheet" href="member-shell.css?v=62"><style>.channel-page{max-width:1100px;margin:0 auto;padding:30px 18px 60px}.channel-hero,.channel-video{background:var(--bg-secondary,#12151c);border:1px solid var(--border-default,#263044);border-radius:18px}.channel-hero{padding:24px;margin-bottom:22px;display:flex;gap:18px;align-items:center}.channel-hero img{width:82px;height:82px;border-radius:50%;object-fit:cover}.channel-hero p{color:var(--text-secondary,#aab4c5);line-height:1.55}.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.channel-video{overflow:hidden}.channel-video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#080b10}.channel-video-copy{padding:14px}.channel-video-copy h2{font-size:1rem;margin:0 0 8px}.channel-video-copy p{color:var(--text-secondary,#aab4c5);font-size:.86rem;line-height:1.45}@media(max-width:600px){.channel-hero{align-items:flex-start;flex-direction:column}}</style></head><body><div id="site-header"></div><main class="channel-page"><div id="channel-root"><p>Loading channel…</p></div></main><div id="site-footer"></div><script src="includes.js"></script><script src="tpi-channel.js?v=1"></script></body></html>
