<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paper Editor | The Paranormal Initiative</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="pp:title" content="Paper Editor">
    <meta name="pp:subtitle" content="Research Library Drafting Tool">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=15">
</head>
<body class="paper-editor-page editor-locked">
<div id="site-header"></div>

<section class="paper-editor-shell">
    <div class="paper-editor-topbar">
        <div class="paper-editor-brand">Research Paper Editor</div>
        <div class="post-action-controls">
            <button type="button" data-action="contributors">Contributors</button>
            <button type="button" data-action="preview">Preview</button>
            <button type="button" data-action="save-draft">Save Draft</button>
            <button type="button" data-action="publish">Publish Article</button>
            <button type="button" data-action="copy">Copy HTML</button>
        </div>
    </div>

    <input id="editor-title" class="paper-title-input" type="text" value="Untitled Research Paper" aria-label="Paper title">

    <div class="editor-toolbar" aria-label="Editor toolbar">
        <select id="editor-view-mode" aria-label="Editor view mode">
            <option value="compose">Compose view</option>
            <option value="html">HTML view</option>
        </select>
        <button type="button" data-command="undo" title="Undo">Undo</button>
        <button type="button" data-command="redo" title="Redo">Redo</button>
        <select id="editor-block-format" aria-label="Block format">
            <option value="p">Paragraph</option>
            <option value="h3">Heading</option>
            <option value="blockquote">Quote</option>
        </select>
        <button type="button" data-command="bold" title="Bold"><strong>B</strong></button>
        <button type="button" data-command="italic" title="Italic"><em>I</em></button>
        <button type="button" data-command="strikeThrough" title="Strikethrough"><s>S</s></button>
        <button type="button" data-block="blockquote" title="Quote">Quote</button>
        <button type="button" data-command="justifyLeft" title="Left to right">LTR</button>
        <button type="button" data-command="justifyRight" title="Right to left">RTL</button>
        <button type="button" data-action="link" title="Insert link">Link</button>
        <button type="button" data-action="image-menu" title="Insert image">Image</button>
        <button type="button" data-action="video-menu" title="Insert video">Video</button>
        <button type="button" data-action="audio-menu" title="Insert audio">Audio</button>
        <button type="button" data-action="embed" title="Embed code">Embed</button>
        <button type="button" data-action="author-note" title="Insert author note">Author Note</button>
        <button type="button" data-command="removeFormat" title="Clear formatting">Clear Format</button>
    </div>

    <div class="paper-editor-layout">
        <section class="editor-pane">
            <div class="editor-pane-header">
                <h3>Compose</h3>
                <p id="editor-status">Draft ready</p>
            </div>
            <div id="paper-editor-body" class="paper-editor-body" contenteditable="true" spellcheck="true"></div>
            <textarea id="editor-html-view" class="paper-html-view" spellcheck="false"></textarea>
        </section>

        <div class="editor-resize-handle" role="separator" aria-label="Resize post settings panel" aria-orientation="vertical" tabindex="0"></div>

        <aside class="post-settings-panel" aria-label="Post settings">
            <h3>Post Settings</h3>
            <label>
                <span>Subtitle</span>
                <input id="editor-subtitle" type="text" value="Research Library Draft">
            </label>
            <label>
                <span>Destination</span>
                <select id="editor-destination">
                    <option value="education-area-investigation-science.html">Investigation Science</option>
                    <option value="education-area-evidence-science-analysis.html">Evidence Science &amp; Analysis</option>
                    <option value="education-area-instrumentation-technology.html">Instrumentation &amp; Technology</option>
                    <option value="education-area-environmental-research.html">Environmental Research</option>
                    <option value="education-area-evp-itc-research.html">EVP / ITC Research</option>
                    <option value="education-area-consciousness-human-experience.html">Consciousness &amp; Human Experience</option>
                    <option value="education-area-ethics-professional-standards.html">Ethics &amp; Professional Standards</option>
                    <option value="education-area-reporting-documentation.html">Reporting &amp; Documentation</option>
                    <option value="education-area-education-community-development.html">Community Development &amp; Publication</option>
                    <option value="education-area-technology-development-ai.html">Technology Development</option>
                    <option value="education-area-artificial-intelligence.html">Artificial Intelligence</option>
                    <option value="education-area-historical-cultural-research.html">Historical &amp; Cultural Research</option>
                    <option value="investigation-development-series.html">Investigation Development Series</option>
                    <option value="ghostology-101.html">Ghostology Reference</option>
                    <option value="evp-itc-lessons.html">EVP / ITC Research Notes</option>
                    <option value="field-articles.html">Field Articles</option>
                    <option value="method-exercises.html">Method Exercises</option>
                </select>
            </label>
            <label>
                <span>Contribution Type</span>
                <select id="editor-contribution-type">
                    <option value="Research Paper">Research Paper</option>
                    <option value="Research Note">Research Note</option>
                    <option value="Field Article">Field Article</option>
                    <option value="Experimental Report">Experimental Report</option>
                    <option value="Technical Note">Technical Note</option>
                    <option value="Review Paper">Review Paper</option>
                    <option value="Case / Location Study">Case / Location Study</option>
                    <option value="Media Review">Media Review</option>
                    <option value="Method Exercise">Method Exercise</option>
                    <option value="Contributor Note">Contributor Note</option>
                </select>
            </label>
            <label>
                <span>Author</span>
                <input id="editor-author" type="text" value="Todd Wayne">
            </label>
            <label>
                <span>Affiliation</span>
                <input id="editor-affiliation" type="text" value="The Paranormal Initiative - Applied Paranormal Research and Studies">
            </label>
            <label>
                <span>Organization</span>
                <input id="editor-organization" type="text" value="Somerset Paranormal Research Society">
            </label>
            <label>
                <span>Correspondence</span>
                <input id="editor-correspondence" type="email" value="paranormalinitiative@yahoo.com">
            </label>
            <label>
                <span>Website</span>
                <input id="editor-website" type="url" placeholder="Optional author or project website">
            </label>
            <label>
                <span>Source / Link Note</span>
                <input id="editor-source" type="text" placeholder="Optional source, profile, or external paper link">
            </label>
            <label>
                <span>Labels</span>
                <input id="editor-labels" type="text" placeholder="Research, EVP, ITC">
            </label>
            <button type="button" class="settings-action" data-action="publish">Publish Article</button>
            <button type="button" class="settings-action" data-action="clear">Clear Draft</button>
        </aside>
    </div>

    <input id="image-file-input" type="file" accept="image/*" hidden>
    <input id="video-file-input" type="file" accept="video/*" hidden>
    <input id="audio-file-input" type="file" accept="audio/*" hidden>

    <div id="media-modal" class="media-modal" hidden>
        <div class="media-modal-card" role="dialog" aria-modal="true" aria-labelledby="media-modal-title">
            <div class="media-modal-header">
                <h3 id="media-modal-title">Insert Media</h3>
                <button type="button" data-action="media-close" aria-label="Close media dialog">Close</button>
            </div>

            <div class="media-modal-body media-modal-image" hidden>
                <button type="button" data-action="image-upload">Upload From Computer</button>
                <label>
                    <span>Image URL</span>
                    <input id="image-url-input" type="url" placeholder="https://example.com/image.jpg">
                </label>
                <label>
                    <span>Alt Text</span>
                    <input id="image-alt-input" type="text" placeholder="Descriptive text for accessibility">
                </label>
                <label>
                    <span>Caption</span>
                    <input id="image-caption-input" type="text" placeholder="Optional caption displayed below image">
                </label>
                <button type="button" data-action="image-url">Insert Image URL</button>
            </div>

            <div class="media-modal-body media-modal-video" hidden>
                <button type="button" data-action="video-upload">Upload From Computer</button>
                <label>
                    <span>Video URL</span>
                    <input id="video-url-input" type="url" placeholder="YouTube, Rumble, Google Drive, or direct MP4/WebM URL">
                </label>
                <label>
                    <span>Caption</span>
                    <input id="video-caption-input" type="text" placeholder="Optional caption displayed below video">
                </label>
                <button type="button" data-action="video-url">Insert Video URL</button>
                <p>YouTube and Rumble links are embedded when recognized. Direct video files are inserted with controls.</p>
            </div>

            <div class="media-modal-body media-modal-audio" hidden>
                <button type="button" data-action="audio-upload">Upload From Computer</button>
                <label>
                    <span>Audio URL</span>
                    <input id="audio-url-input" type="url" placeholder="https://example.com/audio.mp3">
                </label>
                <label>
                    <span>Caption</span>
                    <input id="audio-caption-input" type="text" placeholder="Optional caption displayed below audio player">
                </label>
                <button type="button" data-action="audio-url">Insert Audio URL</button>
            </div>
        </div>
    </div>

    <div id="publish-modal" class="media-modal" hidden>
        <div class="media-modal-card publish-modal-card" role="dialog" aria-modal="true" aria-labelledby="publish-modal-title">
            <div class="media-modal-header">
                <h3 id="publish-modal-title">Publish Article</h3>
                <button type="button" data-action="publish-close" aria-label="Close publish dialog">Close</button>
            </div>
            <div class="media-modal-body">
                <p id="publish-summary"></p>
                <label>
                    <span>Article File</span>
                    <input id="publish-filename" type="text" readonly>
                </label>
                <label>
                    <span>Destination Page</span>
                    <input id="publish-destination" type="text" readonly>
                </label>
                <button type="button" data-action="download-article">Download Article HTML</button>
                <button type="button" data-action="publish-destination">Publish To Destination</button>
                <button type="button" data-action="copy-full-page">Copy Full Article HTML</button>
                <button type="button" data-action="copy-card">Copy Destination Card</button>
                <button type="button" data-action="open-destination">Open Destination Page</button>
            </div>
        </div>
    </div>
</section>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="api-client.js"></script>
<script src="paper-editor.js"></script>
</body>
</html>
