<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Explore | The Paranormal Initiative</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="pp:title" content="Explore">
    <meta name="pp:subtitle" content="Community Activity">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=23">
    <link rel="stylesheet" href="member-shell.css?v=2">
</head>
<body>
<div id="site-header"></div>

<div data-member-content hidden>
<div class="member-main-inner">
    <section class="editor-access-card member-explore-card">
        <p class="portal-kicker">Community Activity</p>
        <h2>Explore</h2>
        <p class="access-note">See recent community posts, contributed articles, videos, photos, and live activity as it starts.</p>
        <div class="member-explore-toolbar">
            <button class="portal-button" type="button" data-explore-filter="all">All</button>
            <button class="portal-button portal-button-secondary" type="button" data-explore-filter="forum_post">Posts</button>
            <button class="portal-button portal-button-secondary" type="button" data-explore-filter="chat">Chats</button>
            <button class="portal-button portal-button-secondary" type="button" data-explore-filter="article">Contributions</button>
            <button class="portal-button portal-button-secondary" type="button" data-explore-filter="photo">Photos</button>
            <button class="portal-button portal-button-secondary" type="button" data-explore-filter="video">Videos</button>
        </div>
        <div class="member-explore-actions">
            <button class="portal-button portal-button-secondary" type="button" data-explore-mark-read>Mark All Read</button>
            <button class="portal-button portal-button-secondary" type="button" data-explore-mark-unread>Mark All Unread</button>
        </div>
        <div class="member-explore-feed" data-explore-feed>
            <p class="access-note">Loading community activity...</p>
        </div>
    </section>
</div>
</div>

<div id="site-footer"></div>
<script src="includes.js"></script>
<script src="api-client.js"></script>
<script src="member-login.js?v=24"></script>
<script src="member-shell.js?v=2"></script>
<script src="explore.js"></script>
</body>
</html>
